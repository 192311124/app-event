name: Mobile E2E Automation - Appium & Android

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mobile-e2e-tests:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Install Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5 & 6. Run Android Emulator & Execute Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Pixel_6
          disable-animations: true
          script: |
            echo "Android Emulator is online and ready."
            adb devices
            
            echo "Installing project dependencies..."
            npm ci || npm install
            
            echo "Installing Appium UiAutomator2 driver..."
            npx appium driver install uiautomator2 || true
            
            echo "Starting Appium server in background..."
            npx appium --log ./appium.log &
            sleep 5
            
            if [ -f "./gradlew" ]; then
              chmod +x gradlew || true
              ./gradlew assembleDebug --no-daemon || true
            fi
            
            echo "Executing E2E Test Suite..."
            npm test || true
            npm run report:excel || true

      - name: 7. Ensure Report Directory & Standalone Excel Generation
        if: always()
        run: |
          mkdir -p excel reports screenshots logs
          npm run report:excel || true

      - name: 8. Upload Downloadable Mobile E2E Excel & Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appium-Mobile-E2E-Excel-Report
          path: |
            excel/Mobile_E2E_Report.xlsx
            excel/**
            reports/**
            screenshots/**
            logs/**
          if-no-files-found: warn
          retention-days: 30
