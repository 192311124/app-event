name: Mobile E2E Automation - Appium & Android

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mobile-e2e-tests:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: 3. Install Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5 & 6. Run Android Emulator & Execute Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          script: |
            echo "Android Emulator is online and ready."
            adb devices
            
            echo "Installing Appium 2.x and UiAutomator2 driver..."
            npm install -g appium
            appium driver install uiautomator2
            appium -v
            
            appium --log ./appium.log &
            sleep 5
            
            npm ci || npm install
            
            if [ -f "./gradlew" ]; then
              ./gradlew assembleDebug --no-daemon || true
            fi
            
            npm test || true
            npm run report:excel || true

      - name: 7. Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appium-Mobile-E2E-Test-Results
          path: |
            excel/Mobile_E2E_Report.xlsx
            reports/
            screenshots/
            logs/
          retention-days: 30
