name: Mobile E2E Automation - Appium & Android

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mobile-e2e-tests:
    name: Run Enterprise Mobile E2E 250+ Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Install Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Install Project Dependencies
        run: |
          npm ci || npm install

      - name: 5. Initialize Appium Automation Server & Drivers
        run: |
          mkdir -p logs
          npx appium driver install uiautomator2 || true
          npx appium -v
          npx appium --log ./logs/appium.log &
          sleep 5

      - name: 6. Execute 250+ Mobile E2E Test Suite
        run: |
          npm test || true

      - name: 7. Generate Executive 4-Sheet Excel & HTML Reports
        if: always()
        run: |
          mkdir -p excel reports screenshots logs
          npm run report:excel

      - name: 8. Upload Downloadable Mobile E2E Excel & Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appium-Mobile-E2E-Excel-Report
          path: |
            excel/Mobile_E2E_Report.xlsx
            excel/
            reports/
            screenshots/
            logs/
          if-no-files-found: warn
          retention-days: 30
